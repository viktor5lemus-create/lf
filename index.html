<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="robots" content="noindex">
<title>Lemus Flooring LLC</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Inter:wght@300&amp;display=swap" rel="stylesheet">
<style>
:root{
 --brand-gold:#D4A017;--brand-black:#000000;
 --gold-gradient:linear-gradient(180deg,#8A6426 0%,#BC943D 18%,#D9BE60 34%,#E9D674 46%,#E2CB6B 56%,#CDAD50 70%,#B5903D 84%,#856025 100%);
 --gold-text:linear-gradient(180deg,#BC943D 0%,#E9D674 45%,#CDAD50 75%,#B5903D 100%);
 --gold-deep:#8A6426;--gold-light:#E9D674;
 --bg-0:#000000;--bg-1:#0A0806;--bg-2:#13100B;--bg-3:#1C1710;
 --ink:#F4EAD0;--ink-muted:#A39674;--line:rgba(212,160,23,.22);--glow:rgba(212,160,23,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--brand-black);color:var(--ink)}
body{height:100dvh;touch-action:manipulation;background:radial-gradient(ellipse at 50% 45%,#1E1709 0%,#0A0806 45%,#000 80%);font-family:Inter,-apple-system,system-ui,sans-serif}
#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.035;pointer-events:none}
.view{position:absolute;inset:0;display:grid;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;pointer-events:none}
.view.on{opacity:1;visibility:visible;pointer-events:auto}
#home{display:flex}
.mark{position:relative;width:min(64vw,900px);margin:auto;transition:transform .3s,opacity .3s}
.mark:before{content:"";position:absolute;inset:-35% -8%;border-radius:50%;background:radial-gradient(ellipse,var(--glow),transparent 68%);opacity:.25;animation:breathe 8s ease-in-out infinite alternate}
.mark img{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 0 28px rgba(212,160,23,.30))}
#home:not(.on) .mark{transform:translateY(-160px) scale(.28);opacity:0}
#pad{display:flex;flex-direction:column;justify-content:space-around;padding:24px 0}
.panel{position:relative;margin:auto;width:398px;padding:28px 30px 30px;border:1px solid transparent;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)) padding-box;box-shadow:0 40px 100px rgba(0,0,0,.75),0 8px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transform:translateY(24px);transition:transform .35s,opacity .35s;opacity:0}
.panel:before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:linear-gradient(var(--line),transparent);mask:linear-gradient(var(--brand-black) 0 0) content-box,linear-gradient(var(--brand-black) 0 0);mask-composite:exclude;pointer-events:none}
#pad.on .panel{opacity:1;transform:translateY(0)}
.lion{display:block;width:auto;height:90px;margin:0 auto 22px}
#dots{display:flex;justify-content:space-around;width:222px;height:24px;margin:0 auto 28px;align-items:normal}
.slot{width:16px;height:16px;margin:auto 0;border:1px solid var(--line);border-radius:50%;position:relative}
.slot:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--gold-gradient);box-shadow:0 0 15px var(--glow);opacity:0;transform:scale(.4);transition:transform .12s,opacity .12s}
.slot.full:after{opacity:1;transform:scale(1)}
#dots.busy .full:after{animation:pulse .8s ease-in-out infinite alternate}
#dots.no{animation:shake .3s ease-in-out}
.keys{display:grid;grid-template-columns:repeat(3,100px);gap:18px}
button{position:relative;display:grid;place-items:normal;width:100px;height:100px;padding:0;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,var(--bg-3),var(--bg-1));box-shadow:8px 10px 22px rgba(0,0,0,.85),-2px -2px 10px rgba(212,160,23,.05),inset 0 1px 0 rgba(255,255,255,.06);cursor:pointer;transition:transform 90ms;touch-action:manipulation}
button span{margin:auto;font-variant-numeric:lining-nums;font:500 40px Cinzel,"Trajan Pro",Georgia,serif;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
button:active:not(:disabled){transform:translateY(2px);box-shadow:2px 3px 8px rgba(0,0,0,.85),inset 0 2px 8px rgba(0,0,0,.6),0 0 0 2px var(--glow)}
button:focus-visible{outline:2px solid var(--gold-light);outline-offset:4px}
button svg{width:30px;height:30px;margin:auto;fill:none;stroke:var(--ink-muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button.go{background:var(--gold-text);overflow:hidden}
button.go svg{stroke:#1A1206;stroke-width:2.3}
button.go:after{content:"";position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-80%);opacity:0;pointer-events:none}
#pad.on button.go:after{animation:sheen 7s ease-in-out infinite}
#greet{display:flex;text-align: initial}
.hello{position:relative;margin:auto;text-align:inherit;display:flex;flex-direction:column;align-items:normal;max-width:92vw;transform:translateY(16px);transition:transform .35s}
#greet.on .hello{transform:translateY(0)}
.hello .lion{height:220px;margin-bottom:32px;transform:translateY(-120px) scale(.41);transition:transform .35s}
#greet.on .lion{transform:translateY(0) scale(1)}
.halo{position:absolute;top:-65px;left:calc(50% - 200px);width:400px;height:350px;background:radial-gradient(ellipse,var(--glow),transparent 67%);opacity:0;pointer-events:none}
#greet.on.fresh .halo{animation:flare 1.2s ease-out both}
#line{font:300 40px/1.3 Inter,-apple-system,system-ui,sans-serif;margin:0 auto 10px}
#name{position:relative;display:table;margin:0 auto;max-width:90vw;overflow:hidden;font:600 clamp(48px,9.3vw,110px)/1.25 Cinzel,"Trajan Pro",Georgia,serif;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
#name:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);opacity:0;transform:translateX(-100%);pointer-events:none}
#greet.on.fresh #name:after{animation:glint 1.1s .3s ease-out both}
#greet.problem .lion{height:90px;margin-bottom:30px}
#greet.problem #line{font-size:28px;margin-bottom:0}
#greet.problem #name{display:none}
@media(orientation:portrait){.mark{width:min(84vw,900px)}}
@media(max-height:760px){#pad{padding:12px 0}.panel{padding-top:18px;padding-bottom:20px}.lion{height:70px;margin-bottom:14px}#dots{margin-bottom:18px}.keys{grid-template-columns:repeat(3,96px)}button{width:96px;height:96px}.panel{width:386px}}
@keyframes breathe{from{opacity:.25;transform:scale(.96)}to{opacity:.45;transform:scale(1.04)}}
@keyframes pulse{from{opacity:.45;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes sheen{0%,78%{opacity:0;transform:translateX(-80%)}81%{opacity:1}96%,100%{opacity:0;transform:translateX(80%)}}
@keyframes glint{0%{opacity:0;transform:translateX(-100%)}30%{opacity:1}100%{opacity:0;transform:translateX(100%)}}
@keyframes flare{0%{opacity:0;transform:scale(.7)}45%{opacity:.7}100%{opacity:0;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.mark,.panel,.hello,.hello .lion,.slot:after,button{transform:none!important;transition-property:opacity}.mark:before{opacity:.3}}
</style>
</head>

<script>
/* CONFIG: JSON value for k; URL fallback; exec for another host. */
var OK = !!new URLSearchParams(location.search).get('k');
var K = '';
var EXEC = 'https://script.google.com/macros/s/AKfycbwRiW8i98kyW_kBm7EuuVAodRYr3wxl8k2DvP6xnPRem2M0onhHVPtB98Qxk7jdhmPE/exec';
/* CONFIG END */
(function(){
'use strict';
var q = new URLSearchParams(location.search).get('k');
K = q || K || '';
var $ = function(v){return document.querySelector(v);};
var home=$('#home'), pad=$('#pad'), greet=$('#greet'), dots=$('#dots');
greet.querySelector('img').src=pad.querySelector('img').src;
var slots=Array.from(dots.children), keys=Array.from(document.querySelectorAll('button'));
var val='', stage='home', busy=false, wrong=0, until=0, last=0, end=0, rev=0, unlocked=false;
var now=function(){return performance.now();};
function delay(ms){return new Promise(function(resolve){var due=now()+ms;function step(){if(now()>=due)resolve();else requestAnimationFrame(step);}requestAnimationFrame(step);});}
function paint(){slots.forEach(function(el,i){el.classList.toggle('full',i<val.length);});}
function hold(v){busy=v;keys.forEach(function(el){el.disabled=v;});dots.classList.toggle('busy',v);}
function show(v){stage=v;[home,pad,greet].forEach(function(el){var on=el.id===v;el.classList.toggle('on',on);el.inert=!on;});if(v==='home'){val='';paint();hold(false);rev++;}}
function say(v){try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=1;window.speechSynthesis.speak(u);}}catch(e){}}
var api={submit:function(v){return new Promise(function(resolve,reject){if(window.google&&window.google.script&&window.google.script.run){window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submit(v,K);}else if(EXEC){fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:K,c:v}),credentials:'omit'}).then(function(r){if(!r.ok)throw new Error();return r.json();}).then(resolve,reject);}else reject(new Error());});}};
async function miss(){wrong++;hold(true);dots.classList.remove('busy');dots.classList.add('no');await delay(300);dots.classList.remove('no');val='';paint();hold(false);last=now();if(wrong>=5){until=now()+60000;wrong=0;show('home');}}
function hello(r){val='';paint();hold(false);var good=r.s==='OK'||r.s==='A';if(good)wrong=0;greet.classList.toggle('fresh',r.s==='OK');greet.classList.toggle('problem',!good);$('#line').textContent=good?(r.s==='OK'?'Good morning,':"You're all set,"):'Please see the office.';$('#name').textContent=good&&typeof r.n==='string'?r.n:'';show('greet');end=now()+2200;say($('#line').textContent+(good?' '+$('#name').textContent:''));}
async function send(){if(busy)return;if(val.length<4){await miss();return;}hold(true);var ticket=++rev;try{var r=await Promise.race([api.submit(val),delay(12000).then(function(){throw new Error();})]);if(ticket!==rev)return;if(!r||!r.s){hello({s:'E'});return;}if(r.s==='N'||r.s==='L'){await miss();return;}if(r.s==='X'){OK=false;show('home');return;}hello(r);}catch(e){if(ticket===rev)hello({s:'E'});}}
home.addEventListener('click',function(){if(!OK||now()<until||stage!=='home')return;if(!unlocked){say('');unlocked=true;}val='';paint();last=now();show('pad');});
keys.forEach(function(el){el.addEventListener('click',function(){if(stage!=='pad'||busy)return;last=now();var v=el.dataset.v;if(v==='go'){send();return;}if(v==='del')val=val.slice(0,-1);else if(val.length<6)val+=v;paint();});});
pad.addEventListener('pointerdown',function(){if(!busy)last=now();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
function tick(){var n=now();if(stage==='pad'&&!busy&&n-last>=15000)show('home');if(stage==='greet'&&n>=end)show('home');requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
